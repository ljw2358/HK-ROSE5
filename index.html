<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB | Web3 Digital & Internet Bank</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --accent-purple: #7b2cbf;
            --accent-gold: #d4af37;
            --accent-neon: #00f2fe;
            --text-main: #f0f4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        /* 1. TOP HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1000;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .header-info {
            display: flex;
            align-items: center;
        }

        .agi-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-neon);
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .agi-status::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-neon);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-neon);
        }

        /* 2. HERO PAGE (SINGLE FULL VIEW) */
        .hero-section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0a0e17 80%);
            padding: 0 20px;
        }

        .hero-card {
            border: 3px solid rgba(212, 175, 55, 0.5);
            padding: 80px 50px;
            border-radius: 30px;
            background: rgba(19, 26, 41, 0.8);
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            max-width: 1000px;
            width: 100%;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        .hero-sub {
            color: var(--accent-gold);
            font-size: 1.5rem;
            margin-bottom: 50px;
            font-weight: 600;
        }

        /* DUAL ENTER BUTTONS */
        .hero-btn-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-main {
            padding: 22px 45px;
            color: white;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s, filter 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-web3 {
            background: linear-gradient(90deg, var(--accent-purple), #4c1d95);
        }

        .btn-internet {
            background: linear-gradient(90deg, #059669, #047857);
        }

        .btn-main:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header>
        <div class="logo">HKWB</div>
        <div class="header-info">
            <div class="agi-status">60개국 AGI 가동 중</div>
        </div>
    </header>

    <!-- HERO PAGE (CLEAN LANDING VIEW) -->
    <section class="hero-section">
        <div class="hero-card">
            <h1 class="hero-title">인류와 기술이 공존하는<br>차세대 디지털 금융 혁신</h1>
            <p class="hero-sub">10대 글로벌 보안 기술 & AI 기술 기반 글로벌 자율 금융 플랫폼</p>
            <div class="hero-btn-group">
                <button class="btn-main btn-web3" onclick="alert('Web3 디지털 은행 시스템을 생성합니다.')">Web3 디지털 은행 진입하기 ↓</button>
                <button class="btn-main btn-internet" onclick="alert('인터넷 뱅크 시스템을 생성합니다.')">인터넷 뱅크 진입하기 ↓</button>
            </div>
        </div>
    </section>

</body>
</html>
